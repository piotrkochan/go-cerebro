services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.15.0}
    environment:
      node.name: elasticsearch
      cluster.name: ${ELASTICSEARCH_CLUSTER_NAME:-cerebro-dev}
      discovery.seed_hosts: elasticsearch,elasticsearch-2
      cluster.initial_master_nodes: elasticsearch,elasticsearch-2
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - es-data:/usr/share/elasticsearch/data

  elasticsearch-2:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.15.0}
    environment:
      node.name: elasticsearch-2
      cluster.name: ${ELASTICSEARCH_CLUSTER_NAME:-cerebro-dev}
      discovery.seed_hosts: elasticsearch,elasticsearch-2
      cluster.initial_master_nodes: elasticsearch,elasticsearch-2
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - es-data-2:/usr/share/elasticsearch/data

  cerebro:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${CEREBRO_PORT:-9000}:${CEREBRO_PORT:-9000}"
    environment:
      CEREBRO_PORT: "${CEREBRO_PORT:-9000}"
      APPLICATION_SECRET: "${APPLICATION_SECRET:-docker-compose-dev-auth-secret-change-me}"
      BASIC_AUTH_ENABLED: "${BASIC_AUTH_ENABLED:-true}"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-admin}"
      BASIC_AUTH_PWD: "${BASIC_AUTH_PWD:-admin123}"
      PROXY_AUTH_ENABLED: "${PROXY_AUTH_ENABLED:-false}"
    volumes:
      - ./:/workspace/cerebro
    working_dir: /workspace/cerebro
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-2:
        condition: service_healthy

  frontend:
    image: node:26-alpine
    working_dir: /workspace/cerebro
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_TARGET: "${VITE_API_TARGET:-http://cerebro:9000}"
    volumes:
      - ./:/workspace/cerebro
      - node-modules:/workspace/cerebro/node_modules
    depends_on:
      - cerebro

  github-auth-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    command:
      - --provider=github
      - --http-address=0.0.0.0:4180
      - --upstream=${OAUTH2_PROXY_UPSTREAM:-http://frontend:5173}
      - --redirect-url=${OAUTH2_PROXY_REDIRECT_URL:-http://localhost:9001/oauth2/callback}
      - --email-domain=*
      - --cookie-secure=false
      - --pass-user-headers=true
      - --set-xauthrequest=true
      - --skip-provider-button=${OAUTH2_PROXY_SKIP_PROVIDER_BUTTON:-false}
      - --reverse-proxy=true
    ports:
      - "${OAUTH2_PROXY_PORT:-9001}:4180"
    environment:
      OAUTH2_PROXY_CLIENT_ID: "${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID from your GitHub OAuth App}"
      OAUTH2_PROXY_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET from your GitHub OAuth App}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET:-dev-cookie-secret-32-bytes-ok!!!}"
    depends_on:
      - frontend

volumes:
  es-data:
  es-data-2:
  node-modules:
