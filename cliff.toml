[changelog]
header = ""
body = """
{%- if commits | length > 0 %}
### Chore
{% for commit in commits -%}
- {% if commit.remote.pr_title %}{{ commit.remote.pr_title }}{% else %}{{ commit.message | split(pat="\n") | last | trim }}{% endif %}{% if commit.remote.pr_number %} (#{{ commit.remote.pr_number }}){% endif %}
{% endfor -%}
{% endif -%}
{%- if github and github.contributors | filter(attribute="is_first_time", value=true) | length > 0 %}

### New contributors
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor -%}
{% endif -%}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = true
commit_parsers = [
  { message = '^chore(?:\([^)]*\))?!?:', group = "Chore" },
  { message = '^Merge pull request #[0-9]+ from [^/]+/dependabot/', group = "Chore" },
  { field = "author.name", pattern = '^dependabot\[bot\]$', group = "Chore" },
  { message = ".*", skip = true },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(?:-.*)?$'
ignore_tags = '.*-.*'
topo_order = true
sort_commits = "oldest"
