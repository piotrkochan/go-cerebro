[changelog]
header = ""
body = """
{%- if commits | length > 0 %}
### Chore
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor -%}
{% endif -%}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = true
commit_parsers = [
  { field = "author.name", pattern = '^dependabot\[bot\]$', group = "Chore" },
  { message = ".*", skip = true },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(?:-.*)?$'
ignore_tags = '.*-.*'
topo_order = true
sort_commits = "oldest"
