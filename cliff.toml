[changelog]
header = ""
body = """
{%- if commits | length > 0 %}
### Chore
{% for commit in commits -%}
- {% if commit.remote.pr_title %}{{ commit.remote.pr_title }}{% else %}{{ commit.message | split(pat="\n") | last | trim }}{% endif %}{% if commit.remote.pr_number %} (#{{ commit.remote.pr_number }}){% endif %}
{% endfor -%}
{% endif -%}
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = true
commit_parsers = [
  { message = '^Merge pull request #[0-9]+ from [^/]+/dependabot/', group = "Chore" },
  { message = ".*", skip = true },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(?:-.*)?$'
ignore_tags = '.*-.*'
topo_order = true
sort_commits = "oldest"
