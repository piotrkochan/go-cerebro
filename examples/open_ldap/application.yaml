hosts: []

auth:
  session:
    cookie_max_age_seconds: 28800
    max_lifetime_seconds: 28800
    idle_timeout_seconds: 1800
  ldap:
    enabled: true
    url: "ldap://ldap:389"
    base_dn: "DC=example,DC=org"
    user_template: "uid=%s,%s"
    # The example LDAP container uses plain ldap:// for local testing.
    # Production config should use ldaps:// or ca_cert_file.
    insecure_ldap: true

server:
  port: 9000
  base_path: "/"
  secret: "${APPLICATION_SECRET}"
  cookie_secure: false
  csrf_enabled: true

es:
  allow_ad_hoc_hosts: false
