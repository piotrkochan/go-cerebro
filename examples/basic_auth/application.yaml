hosts: []

auth:
  session:
    cookie_max_age_seconds: 28800
    max_lifetime_seconds: 28800
    idle_timeout_seconds: 1800
  basic:
    enabled: true
    username: "${BASIC_AUTH_USER}"
    password: "${BASIC_AUTH_PWD}"

server:
  port: 9000
  base_path: "/"
  secret: "${APPLICATION_SECRET}"
  cookie_secure: false
  csrf_enabled: true

es:
  allow_ad_hoc_hosts: false
