# Go Cerebro example configuration. Copy to application.yaml and edit.
#
# Environment variables are expanded inside string values, for example
# "${APPLICATION_SECRET}". Direct overrides also exist for CEREBRO_PORT
# and APPLICATION_SECRET.

# A list of known hosts (Elasticsearch clusters). Each host can have its own auth
# and a whitelist of HTTP headers forwarded from the user's request to ES.
hosts:
  - id: "local-cluster"
    name: "Local cluster"
    host: "http://localhost:9200"
    # auth:
    #   username: "elastic"
    #   password: "changeme"
    headers_whitelist: ["x-proxy-user", "x-proxy-roles", "X-Forwarded-For"]

# Application authentication. Enable one or more providers.
auth:
  basic:
    enabled: false
    username: "${BASIC_AUTH_USER}"
    password: "${BASIC_AUTH_PWD}"
    # Optional static groups for basic auth. Useful when RBAC is enabled.
    # groups: ["cerebro-admins"]

  ldap:
    enabled: false
    # Use ldaps:// in production. For private development-only ldap:// tests,
    # set insecure_ldap: true.
    url: "${LDAP_URL}"
    # ca_cert_file: "/etc/cerebro/ldap-ca.pem"
    base_dn: "${LDAP_BASE_DN}"
    method: "${LDAP_METHOD}"
    user_template: "${LDAP_USER_TEMPLATE}"
    bind_dn: "${LDAP_BIND_DN}"
    bind_pw: "${LDAP_BIND_PWD}"
    # LDAP requires ldaps:// by default. Set this only for isolated development tests.
    insecure_ldap: false
    group_search:
      base_dn: "${LDAP_GROUP_BASE_DN}"
      user_attr: "${LDAP_USER_ATTR}"
      user_attr_template: "${LDAP_USER_ATTR_TEMPLATE}"
      # LDAP group filter, for example "(objectClass=groupOfNames)" or
      # "(&(objectClass=groupOfNames)(cn=cerebro-*)))."
      group: "${LDAP_GROUP}"
      # Attribute used as the short group name exposed to RBAC. The full group DN
      # is also exposed, so RBAC can bind either group:cerebro-admins or
      # group:cn=cerebro-admins,ou=groups,dc=example,dc=com.
      name_attr: "cn"

  proxy:
    enabled: false
    # For oauth2-proxy, Azure Entra ID behind oauth2-proxy, Authelia, Traefik
    # ForwardAuth, nginx auth_request or another trusted reverse proxy.
    # Never enable this unless Cerebro is reachable only through trusted_proxies.
    user_header: "X-Forwarded-User"
    groups_header: "X-Forwarded-Groups"
    group_separator: ","
    trusted_proxies: ["127.0.0.1/32"]

  entra_id:
    enabled: false
    tenant_id: "${ENTRA_ID_TENANT_ID}"
    client_id: "${ENTRA_ID_CLIENT_ID}"
    client_secret: "${ENTRA_ID_CLIENT_SECRET}"
    # Optional. If empty, Cerebro derives it from the incoming request.
    # Register the exact URL in Entra ID app registration redirect URIs.
    # redirect_url: "https://cerebro.example.org/auth/entraid/callback"
    username_claim: "preferred_username"
    groups_claim: "groups"
    scopes: ["openid", "profile", "email"]

server:
  port: 9000
  base_path: "/"
  # Required when any auth provider is enabled. Use a strong random value.
  secret: "${APPLICATION_SECRET}"
  # Keep true when served through HTTPS. Set false only for local HTTP dev.
  cookie_secure: true
  # Require a session-bound CSRF token for Cerebro API requests.
  csrf_enabled: true
  max_request_bytes: 5242880
  # Optional HTTPS listener. When both files are configured, Cerebro serves HTTPS.
  # tls_cert_file: "/etc/cerebro/tls/tls.crt"
  # tls_key_file: "/etc/cerebro/tls/tls.key"
  # HSTS is emitted only for HTTPS requests, including requests behind a proxy
  # that sets X-Forwarded-Proto: https.
  hsts_enabled: true
  hsts_max_age_seconds: 31536000
  hsts_include_subdomains: true

es:
  gzip: true
  # false means users can connect only to configured hosts.
  allow_ad_hoc_hosts: false
  max_response_bytes: 26214400
  # Optional TLS trust and mutual TLS for Elasticsearch.
  # ca_cert_file: "/etc/cerebro/es-ca.pem"
  # client_cert_file: "/etc/cerebro/es-client.pem"
  # client_key_file: "/etc/cerebro/es-client-key.pem"
  # Optional AWS SigV4 signing for Amazon OpenSearch Service.
  # aws:
  #   enabled: false
  #   region: "eu-central-1"
  #   service: "es" # use "aoss" for OpenSearch Serverless
  #   profile: ""
  #   access_key_id: "${AWS_ACCESS_KEY_ID}"
  #   secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  #   session_token: "${AWS_SESSION_TOKEN}"

rest:
  history_size: 50

features:
  # Read-only browser for documents inside an index. Disabled by default because
  # it exposes document contents to every authenticated Cerebro user.
  data_explorer: false

rbac:
  # Optional backend authorization. Authentication identifies the user; RBAC decides
  # which API resources/actions that user can call.
  enabled: false
  default_role: "role:viewer"
  bindings:
    - {subject: "admin", role: "role:admin"}
    - {subject: "group:cerebro-admins", role: "role:admin"}
  policies:
    # Cerebro-feature policy shape: subject + resource + action + object + effect.
    # Policies are evaluated by Casbin. Wildcards use shell-style matching.
    # Deny wins over allow.
    # Object is cluster-scoped: cluster-wide actions use the cluster id, resource
    # actions use cluster-id/name, e.g. "prod" or "prod/index-*".
    - {subject: "role:admin", resource: "*", action: "*", object: "*", effect: "allow"}
    - {subject: "role:viewer", resource: "*", action: "read", object: "*", effect: "allow"}
    - {subject: "role:viewer", resource: "rest", action: "execute", object: "*", effect: "deny"}

data:
  path: "./cerebro.db"

logging:
  # debug | info | warn | error
  level: "info"
  # text | json. Applies to application logs and request logs.
  format: "text"
  # Controls per-request HTTP access logs. Request logs are emitted at info level.
  request_log_enabled: true
