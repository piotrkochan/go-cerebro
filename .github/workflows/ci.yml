name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Go dependencies
        run: go mod download

      - name: Check Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Generate OpenAPI client
        run: npm run api:generate

      - name: Check generated API is committed
        run: git diff --exit-code -- openapi/cerebro.json src/api/client

      - name: Run frontend and API typechecks
        run: |
          npm run typecheck
          npm run api:typecheck

      - name: Run Go tests
        run: go test -race -shuffle=on -coverprofile=coverage.out ./cmd/... ./internal/...

      - name: Build frontend
        run: npm run build:vite

      - name: Build Go binary
        run: go build -v ./cmd/cerebro

  elasticsearch-compatibility:
    name: Elasticsearch compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: es-5-6
            versions: "5:5.6.16 6:6.8.23"
          - name: es-7
            versions: "7:7.10.2 7:7.17.28"
          - name: es-8
            versions: "8:8.15.0 8:8.19.6"
          - name: es-9
            versions: "9:9.2.0 9:9.3.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure Elasticsearch host limits
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Download Go dependencies
        run: go mod download

      - name: Run Elasticsearch compatibility tests
        env:
          CEREBRO_E2E_ES_VERSIONS: ${{ matrix.versions }}
        run: bash scripts/e2e-elasticsearch-compat.sh

  floci-opensearch-compatibility:
    name: Floci OpenSearch compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Run Floci OpenSearch compatibility tests
        run: bash scripts/e2e-floci-opensearch-compat.sh

  ldap-rbac:
    name: Auth e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Run LDAP RBAC tests
        run: bash scripts/e2e-ldap-rbac.sh

      - name: Run proxy auth tests
        run: bash scripts/e2e-proxy-auth.sh
