name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read release version from tag
        id: release-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Install git-cliff
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: git-cliff@2.13.1
          fallback: none

      - name: Generate release notes
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" dist/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set frontend package version
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: npm version "${RELEASE_VERSION}" --allow-same-version --no-git-tag-version --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Go dependencies
        run: go mod download

      - name: Check Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Generate OpenAPI client
        run: npm run api:generate

      - name: Check generated API is committed
        run: git diff --exit-code -- openapi/cerebro.json src/api/client

      - name: Run frontend and API typechecks
        run: |
          npm run typecheck
          npm run api:typecheck

      - name: Run Go tests
        run: go test -race -shuffle=on ./cmd/... ./internal/...

      - name: Build frontend
        env:
          VITE_APP_VERSION: ${{ steps.release-version.outputs.version }}
        run: npm run build:vite

      - name: Upload frontend assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-assets
          path: internal/server/static
          if-no-files-found: error

  build-binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-assets
          path: internal/server/static

      - name: Build release binaries
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() {
            local goos="$1"
            local goarch="$2"
            local goarm="${3:-}"
            local ext=""
            if [ "${goos}" = "windows" ]; then
              ext=".exe"
            fi
            local arm_suffix=""
            if [ -n "${goarm}" ]; then
              arm_suffix="v${goarm}"
            fi
            local out="dist/cerebro-${GITHUB_REF_NAME}-${goos}-${goarch}${arm_suffix}${ext}"
            local started
            started="$(date +%s)"
            echo "building ${goos}/${goarch}${arm_suffix} -> ${out}"
            GOOS="${goos}" GOARCH="${goarch}" GOARM="${goarm}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/lmenezes/cerebro/internal/version.Version=${VERSION}" -o "${out}" ./cmd/cerebro
            echo "built ${goos}/${goarch}${arm_suffix} in $(($(date +%s) - started))s"
          }
          targets=(
            "linux amd64"
            "linux arm64"
            "linux arm 7"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch goarm <<< "${target}"
            build "${goos}" "${goarch}" "${goarm:-}"
          done
          sha256sum dist/cerebro-* | sort -k2 > dist/checksums.txt

      - name: Upload release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-binaries
          path: dist
          if-no-files-found: error

  publish-docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [validate, build-binaries]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=prerelease,enable=${{ contains(github.ref_name, '-') }}
            type=sha,format=short

      - name: Build and publish Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            CEREBRO_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=cerebro-docker
          cache-to: type=gha,mode=max,scope=cerebro-docker

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-binaries
      - publish-docker
    outputs:
      subjects: ${{ steps.provenance.outputs.subjects }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-binaries
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: dist

      - name: Prepare provenance subjects
        id: provenance
        run: echo "subjects=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/cerebro-* dist/checksums.txt --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Cerebro ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md \
              "${RELEASE_FLAGS[@]}" \
              --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/cerebro-* \
              dist/checksums.txt \
              --title "Cerebro ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md \
              "${RELEASE_FLAGS[@]}" \
              --verify-tag
          fi

  provenance:
    needs: publish-release
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA requires a version tag here so the generated provenance can be verified.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.publish-release.outputs.subjects }}
      upload-assets: true
